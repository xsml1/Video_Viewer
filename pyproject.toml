[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "video-compare"
version = "0.1.0"
description = "基于真实 PTS 的本地多路视频同步对比工具"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=14,<17",
  "numpy>=2,<3",
  "Pillow>=12,<13",
  "pillow-heif>=1.1,<2",
  "platformdirs>=4,<5",
  "PySide6>=6.8,<7",
  "rawpy>=0.25,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]
build = [
  "Nuitka==4.1.1",
]

[project.scripts]
video-compare = "video_compare.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_compare"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires generated media fixtures",
  "gui: requires a Qt application",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyside6-project]
files = ["main.py"]
